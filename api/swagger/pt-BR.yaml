openapi: 3.0.3
info:
  title: Job Match API
  description: API REST para avaliação de currículos e correspondência com vagas
  version: 1.0.0
  contact:
    name: Bráulio Figueiredo
    email: braulio@braulioti.com.br
    url: http://brau.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:5000
    description: Servidor local de desenvolvimento
  - url: https://job-match-api.brau.io
    description: Servidor de produção

tags:
  - name: Health
    description: Endpoints de verificação de saúde da API

paths:
  /health:
    get:
      tags:
        - Health
      summary: Verifica o status da API
      description: Retorna o status de saúde da API
      operationId: healthCheck
      responses:
        '200':
          description: API está funcionando corretamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: Job Match API

  /api/v1:
    get:
      tags:
        - Health
      summary: Informações da API
      description: Retorna informações sobre a API e seus endpoints
      operationId: apiInfo
      responses:
        '200':
          description: Informações da API
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Job Match API
                  version:
                    type: string
                    example: 1.0.0
                  endpoints:
                    type: object
                    properties:
                      health:
                        type: string
                        example: /health

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Mensagem de erro
          example: Name is required
      required:
        - error

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Autenticação via token JWT (para implementação futura)

